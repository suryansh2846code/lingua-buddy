<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 320px; margin: 0; padding: 14px; color: #1a1a2e; background: #fff; }
      @media (prefers-color-scheme: dark) { body { background: #16161b; color: #ececf2; } }
      h1 { font-size: 15px; margin: 0 0 3px; display: flex; align-items: center; gap: 6px; }
      .sub { font-size: 12px; color: #888; margin: 0 0 12px; }
      .add { display: flex; gap: 6px; align-items: flex-start; }
      textarea { flex: 1; resize: vertical; min-height: 38px; max-height: 140px; font: inherit; font-size: 13px;
        padding: 8px 9px; border: 1px solid #d7d7e0; border-radius: 9px; box-sizing: border-box;
        background: transparent; color: inherit; }
      @media (prefers-color-scheme: dark) { textarea { border-color: #3a3a44; } }
      textarea:focus { outline: none; border-color: #7c6cff; }
      button { font: inherit; cursor: pointer; }
      .primary { background: #7c6cff; color: #fff; border: none; border-radius: 9px; padding: 8px 14px;
        font-size: 13px; font-weight: 600; }
      .primary:hover { background: #6455e0; }
      .primary:active { transform: scale(.96); }
      .count { font-size: 11px; color: #999; margin: 14px 2px 6px; text-transform: uppercase; letter-spacing: .08em; }
      .list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
      .empty { font-size: 12.5px; color: #999; padding: 12px 4px; text-align: center; }
      .row { display: flex; gap: 8px; align-items: flex-start; padding: 8px 9px; border-radius: 9px;
        background: rgba(124,108,255,.06); }
      @media (prefers-color-scheme: dark) { .row { background: rgba(255,255,255,.05); } }
      .txt { flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; word-break: break-word;
        display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
      .acts { display: flex; flex-direction: column; gap: 4px; flex: none; }
      .mini { font-size: 11.5px; color: #6455e0; background: rgba(124,108,255,.12); border: none;
        border-radius: 7px; padding: 4px 9px; }
      .mini:hover { background: rgba(124,108,255,.22); }
      .mini.del { color: #d33; background: rgba(220,60,60,.1); }
      .mini.del:hover { background: rgba(220,60,60,.2); }
      .foot { margin-top: 12px; }
      .link { width: 100%; background: rgba(0,0,0,.05); color: inherit; border: none; padding: 8px;
        border-radius: 9px; font-size: 12.5px; }
      @media (prefers-color-scheme: dark) { .link { background: rgba(255,255,255,.07); } }
    </style>
  </head>
  <body>
    <h1>🗒️ Lingua Buddy clipboard</h1>
    <p class="sub">Save snippets here — reach them on any page from the capsule's clipboard.</p>
    <div class="add">
      <textarea id="text" placeholder="Type or paste text to save…"></textarea>
      <button id="add" class="primary">Add</button>
    </div>
    <div class="count" id="count">Saved</div>
    <div class="list" id="list"></div>
    <div class="foot">
      <button id="opts" class="link">⚙️ Settings (API key)</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
