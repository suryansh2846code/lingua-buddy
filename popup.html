<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 230px; margin: 0; padding: 16px; color: #1a1a2e; }
      h1 { font-size: 15px; margin: 0 0 4px; }
      p { font-size: 12.5px; color: #666; margin: 0 0 12px; line-height: 1.4; }
      kbd { background: #eee; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
      button { width: 100%; background: #7c6cff; color: #fff; border: none; padding: 9px;
        border-radius: 8px; font-size: 13px; cursor: pointer; margin-bottom: 8px; }
      button:hover { background: #6455e0; }
      .link { background: #f2f2f7; color: #333; }
      .link:hover { background: #e6e6ee; }
    </style>
  </head>
  <body>
    <h1>🟣 Lingua Buddy</h1>
    <p>Hover the little bubble on the right edge of any page, then click the orb to activate. Select text to translate, or open 📋 for your last 10 results.</p>
    <button id="opts" class="link">⚙️ Settings (API key)</button>
    <script src="popup.js"></script>
  </body>
</html>
