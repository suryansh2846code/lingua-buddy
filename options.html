<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lingua Buddy — Settings</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 460px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; }
      h1 { font-size: 20px; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; font-size: 14px; }
      input, select { width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ddd;
        border-radius: 8px; box-sizing: border-box; }
      button { margin-top: 20px; background: #7c6cff; color: #fff; border: none; padding: 10px 18px;
        border-radius: 8px; font-size: 14px; cursor: pointer; }
      button:hover { background: #6455e0; }
      .hint { font-size: 12.5px; color: #777; margin-top: 6px; }
      .hint a { color: #7c6cff; }
      #status { margin-top: 14px; font-size: 13px; color: #2b9348; height: 16px; }
    </style>
  </head>
  <body>
    <h1>🟣 Lingua Buddy settings</h1>
    <label for="key">Groq API key</label>
    <input id="key" type="password" placeholder="gsk_..." />
    <div class="hint">
      Get a free key at
      <a href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a>.
      Stored locally in your browser only.
    </div>

    <label for="model">Model</label>
    <select id="model">
      <option value="openai/gpt-oss-120b">openai/gpt-oss-120b (best quality)</option>
      <option value="openai/gpt-oss-20b">openai/gpt-oss-20b (faster)</option>
      <option value="qwen/qwen3.6-27b">qwen/qwen3.6-27b</option>
      <option value="groq/compound">groq/compound</option>
    </select>

    <button id="save">Save</button>
    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
